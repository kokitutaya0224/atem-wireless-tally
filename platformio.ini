[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = /dev/cu.usbserial-21420
monitor_speed = 115200
lib_deps =

; 従来の WiFi 版タリー
[env:esp8266]
build_src_filter = +<wifi/>

; LoRa ベース局（送信機）: WiFi/ATEM 接続 + E220 ブロードキャスト
[env:lora_base]
build_src_filter = +<lora_base/> +<lora_common/>

; LoRa タリー受信機: E220 受信 + RGB LED（WiFi 不要）
[env:lora_tally]
build_src_filter = +<lora_tally/> +<lora_common/>
